name: WebGL PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: Tools
      - name: Verify publishing and notification logic without external requests
        shell: pwsh
        run: |
          & ./Tools/Tests/PublishWebGL.Tests.ps1
          & ./Tools/Tests/PublishWebGL.Git.Tests.ps1

  build:
    needs: validate-publisher
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity Personal activation settings
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          failed=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name. See https://game.ci/docs/github/activation/"
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Roll-a-Ball/Library
          key: unity-webgl-${{ runner.os }}-${{ hashFiles('Roll-a-Ball/Assets/**', 'Roll-a-Ball/Packages/**', 'Roll-a-Ball/ProjectSettings/**') }}
          restore-keys: unity-webgl-${{ runner.os }}-

      - name: Build WebGL at 1920 x 1080
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Roll-a-Ball
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: Roll_a_Ball.EditorTools.WebGLBuildUtility.BuildFromCommandLine
          versioning: None

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webgl-preview
          path: Roll-a-Ball/Builds/WebGL
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    concurrency:
      group: webgl-pages-publish
      cancel-in-progress: false
    steps:
      - name: Check build notification setting
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBGL_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo '::error::Missing Actions secret: DISCORD_WEBGL_WEBHOOK_URL'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webgl-preview
          path: Roll-a-Ball/Builds/WebGL

      - name: Publish, verify URL, and mention roll-a-ball
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBGL_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $parameters = @{
            OutputDirectory = Join-Path $env:GITHUB_WORKSPACE 'Roll-a-Ball/Builds/WebGL'
            Repository = $env:REPOSITORY
            RoleId = '1538587867746668554'
          }
          if ($env:PR_NUMBER) { $parameters.PreviewId = 'pr-' + $env:PR_NUMBER }
          & ./Tools/PublishWebGL.ps1 @parameters
