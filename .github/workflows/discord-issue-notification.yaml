name: Notify Discord on Issue Assignment and Closure

on:
  issues:
    types: [opened, assigned, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ISSUES_NOTIFY_WEBHOOK_URL }}
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const webhookUrl = process.env.DISCORD_WEBHOOK;

            if (!webhookUrl) {
              core.setFailed("DISCORD_WEBHOOK secret is not set.");
              return;
            }

            const assignee = issue.assignee ? issue.assignee.login : '未割り当て';
            let message = '';

            // --- 通知判定ロジック ---

            if (action === 'closed') {
              // Issueがクローズされた時
              message = `✅ **Issueが解決（Closed）されました！**\n**タイトル:** #${issue.number} ${issue.title}\n**担当者:** ${assignee}\n**URL:** ${issue.html_url}`;
            } 
            else if (action === 'opened') {
              // 新規作成（opened）時
              message = `📌 **新しいタスクチケットが起票されました！**\n**タイトル:** #${issue.number} ${issue.title}\n**担当者:** ${assignee}\n**URL:** ${issue.html_url}`;
            } 
            else {
              // 未対応のイベントは通知をスキップして終了
              console.log(`Skip notification for action: ${action} (No assignee or unhandled)`);
              return;
            }

            // Discord Webhook へ送信
            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: message })
            });

            if (!response.ok) {
              core.setFailed(`Discord Webhook failed with status ${response.status}`);
            }
