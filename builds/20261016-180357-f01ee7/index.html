<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roll-a-Ball</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #06111d; color: #e7f5ff; font-family: sans-serif; display: grid; place-items: center; }
        main { width: min(100vw, calc((100dvh - 48px) * 16 / 9), 1920px); }
        .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; }
        canvas { display: block; width: 100%; height: 100%; background: #06111d; outline: none; }
        #loading, #error { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px; background: #06111d; }
        #loading[hidden], #error[hidden] { display: none; }
        progress { width: min(70%, 360px); accent-color: #59cbe8; }
        footer { min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
        button { border: 1px solid #37627d; border-radius: 5px; padding: 6px 14px; background: #12344b; color: #e7f5ff; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>
    <main>
        <div class="screen">
            <canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="Roll-a-Ball ゲーム画面"></canvas>
            <div id="loading" role="status"><span>ゲームを読み込んでいます…</span><progress max="1" value="0"></progress></div>
            <div id="error" role="alert" hidden></div>
        </div>
        <footer><span>Roll-a-Ball</span><button id="fullscreen" type="button" disabled>全画面</button></footer>
    </main>
    <script src="Build/f1ecb0c7ce9d0c9c3b7f0b6af01b5171.loader.js"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loading = document.querySelector("#loading");
        const error = document.querySelector("#error");
        const fullscreen = document.querySelector("#fullscreen");
        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/84a0eb905885241749fe079e40ad4718.data.unityweb",
            frameworkUrl: "Build/7d7e59eb76816e745f496e80421887f8.framework.js.unityweb",
            codeUrl: "Build/86916f3b091392531b6772629e21e5aa.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Roll-a-Ball",
            productVersion: "0.1.0",
            matchWebGLToCanvasSize: false,
            devicePixelRatio: 1,
            autoSyncPersistentDataPath: true
        }, progress => {
            loading.querySelector("progress").value = progress;
        }).then(instance => {
            loading.hidden = true;
            fullscreen.disabled = false;
            fullscreen.addEventListener("click", () => instance.SetFullscreen(1));
        }).catch(() => {
            loading.hidden = true;
            error.textContent = "読み込みに失敗しました。ページを再読み込みしてください。";
            error.hidden = false;
        });
    </script>
</body>
</html>
